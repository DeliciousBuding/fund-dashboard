version: 2
updates:
  # gomod — Go backend
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0  # no auto PRs, manual only
    labels:
      - "dependencies"

  # npm — contracts (zod)
  - package-ecosystem: "npm"
    directory: "/packages/contracts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0  # no auto PRs, manual only
    labels:
      - "dependencies"

  # github-actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
