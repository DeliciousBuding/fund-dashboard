name: publish

# 镜像发布链：push main（或 tag）→ buildx 多架构（linux/amd64,linux/arm64）→ GHCR。
# 产物：ghcr.io/deliciousbuding/fund-dashboard:<full-sha> + :latest（语义化 tag 走 :vX.Y.Z）。
# 两个二进制（fund-dashboard / fund-migrate）经 Dockerfile 多产物 COP 分镜像推送。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS=("ghcr.io/${{ github.repository_owner }}/fund-dashboard:${SHA}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS+=("ghcr.io/${{ github.repository_owner }}/fund-dashboard:v${VERSION}")
          else
            TAGS+=("ghcr.io/${{ github.repository_owner }}/fund-dashboard:latest")
          fi
          printf '%s\n' "${TAGS[@]}" > /tmp/tags.txt
          cat /tmp/tags.txt

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags-file: /tmp/tags.txt
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          build-args: |
            BIN=fund-migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fund-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
