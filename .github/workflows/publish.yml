name: publish

# fund-migrate 一次性迁移镜像（主应用镜像由 ci.yml 的 build-and-push/merge-manifest 既有链发布）。
# 触发：push main / v* tag / 手动。产物：ghcr.io/deliciousbuding/fund-migrate:<full-sha>

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  migrate-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: BIN=fund-migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/deliciousbuding/fund-migrate:${{ github.sha }}
            ghcr.io/deliciousbuding/fund-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
