name: publish

# fund-migrate 一次性迁移镜像（主应用镜像由 ci.yml 的 build-and-push/merge-manifest 既有链发布）。
# 触发：push main / v* tag / 手动。产物：ghcr.io/deliciousbuding/fund-migrate:<full-sha>

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  migrate-image:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migrate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/Dockerfile
          build-args: BIN=fund-migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/deliciousbuding/fund-migrate:${{ github.sha }}
            ghcr.io/deliciousbuding/fund-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
