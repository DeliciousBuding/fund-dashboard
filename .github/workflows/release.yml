name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release, for example v2.10.0"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        default: false
        type: boolean

concurrency:
  group: fund-dashboard-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release metadata
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
            prerelease="${{ inputs.prerelease }}"
            git rev-parse "$tag" >/dev/null
          fi
          case "$tag" in
            v*) ;;
            *) echo "Release tag must start with v: $tag"; exit 1 ;;
          esac
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Go tests
        run: go test ./... -count=1

      - name: Build Go binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/fund-dashboard/

  # Optional container smoke (no Playwright suite required for tag release).
  image-smoke:
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Seed CI database
        run: |
          chmod +x scripts/seed-ci-db.sh
          ./scripts/seed-ci-db.sh deploy/ci-data
          # container runs as unprivileged 'fund' user; make ci-data writable
          chmod -R 777 deploy/ci-data

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: fund-dashboard:ci
          load: true

      - name: Start services via docker compose
        run: |
          docker compose -f deploy/docker-compose.ci.yml up -d
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/health 2>/dev/null | grep -q '"ok"' && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'

      - name: API auth smoke
        run: |
          # admin without key → 401
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/status)
          test "$code" = "401"
          # admin with key → 200
          curl -fsS -H 'Authorization: Bearer ci-test-key' http://localhost:8080/api/admin/status | grep -q '"ok":true'
          curl -fsS -H 'Authorization: Bearer ci-test-key' http://localhost:8080/api/admin/dashboard | grep -q '"go_version"'
          # Session gate: reads are closed without a cookie.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/portfolio)
          test "$code" = "401"
          # First-run setup → session cookie → reads open.
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/fund-cookies -X POST http://localhost:8080/api/auth/setup \
            -H 'Content-Type: application/json' -H 'X-Fund-Request: fetch' \
            -d '{"password":"ci-smoke-password-1"}')
          test "$code" = "201"
          curl -fsS -b /tmp/fund-cookies http://localhost:8080/api/portfolio | grep -q 'total_tx'
          curl -fsS -b /tmp/fund-cookies http://localhost:8080/api/funds | grep -q '019173'
          # mcp without key → 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$code" = "401"
          # mcp with key → tools/list envelope
          curl -fsS -X POST http://localhost:8080/mcp \
            -H 'Authorization: Bearer ci-test-key' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'get_portfolio_summary'

      - name: Show docker logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.ci.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.ci.yml down -v || true

  # GHCR push remains on master CI (workflow_dispatch/push). Tag releases re-use CI image by SHA.
  # Release notes are extracted from CHANGELOG.md for the matching version section.
  github-release:
    needs: [validate, test, image-smoke]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          version="${TAG#v}"
          # Print the "## [x.y.z]" section up to the next "## [" heading.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found=1; print; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            {
              echo "自动生成的发布。镜像：\`ghcr.io/deliciousbuding/fund-dashboard:latest\`"
              echo
              echo '```bash'
              echo 'docker pull ghcr.io/deliciousbuding/fund-dashboard:latest'
              echo '```'
            } > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          name: ${{ needs.validate.outputs.release_tag }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          body_path: release_notes.md
