name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for the following files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Run Go tests (with race detector)
        run: go test ./... -count=1 -race

  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build Go binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/fund-dashboard/

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (biome)
        run: pnpm exec biome check .
      - name: Unit tests (vitest)
        run: pnpm -C web test

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck + build (tsc + vite → internal/webui/dist)
        run: pnpm -C web build

  # ── Container + API smoke (seeded DB) ──────────────────────────
  # The SPA is embedded in the image (go:embed); smoke covers the Go API,
  # the auth gate, and the embedded SPA shell.

  smoke-e2e:
    needs: [test-go, build-go, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install browser test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Seed CI database
        run: |
          chmod +x scripts/seed-ci-db.sh
          ./scripts/seed-ci-db.sh deploy/ci-data
          # container runs as unprivileged 'fund' user; make ci-data writable
          chmod -R 777 deploy/ci-data

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: fund-dashboard:ci
          load: true

      - name: Start services
        run: |
          docker compose -f deploy/docker-compose.ci.yml up -d
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/health 2>/dev/null | grep -q '"ok"' && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'

      - name: API auth smoke
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/status)
          test "$code" = "401"
          curl -fsS -H 'Authorization: Bearer ci-test-key' http://localhost:8080/api/admin/status | grep -q '"ok":true'
          curl -fsS -H 'Authorization: Bearer ci-test-key' http://localhost:8080/api/admin/dashboard | grep -q '"go_version"'

          # Session gate: reads are closed without a cookie.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/portfolio)
          test "$code" = "401"

          # First-run setup → session cookie → reads open.
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/fund-cookies -X POST http://localhost:8080/api/auth/setup \
            -H 'Content-Type: application/json' -H 'X-Fund-Request: fetch' \
            -d '{"password":"ci-smoke-password-1"}')
          test "$code" = "201"
          curl -fsS -b /tmp/fund-cookies http://localhost:8080/api/portfolio | grep -q 'total_tx'
          curl -fsS -b /tmp/fund-cookies http://localhost:8080/api/funds | grep -q '019173'

          # Embedded SPA shell is served at /.
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'

          # MCP bearer auth is unchanged.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$code" = "401"
          curl -fsS -X POST http://localhost:8080/mcp \
            -H 'Authorization: Bearer ci-test-key' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'get_portfolio_summary'

      - name: Browser E2E (Chromium)
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_PASSWORD: ci-smoke-password-1

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show docker logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.ci.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.ci.yml down -v || true

  # ── Docker build & push to GHCR (parallel native runners) ──────

  build-and-push:
    needs: [test-go, build-go, smoke-e2e]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: |
            ghcr.io/deliciousbuding/fund-dashboard:${{ matrix.arch }}-latest
            ghcr.io/deliciousbuding/fund-dashboard:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Merge per-arch images into multi-arch manifest lists for `latest` and `<sha>`.
  merge-manifest:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge architecture manifests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/deliciousbuding/fund-dashboard:latest \
            ghcr.io/deliciousbuding/fund-dashboard:amd64-latest \
            ghcr.io/deliciousbuding/fund-dashboard:arm64-latest
          docker buildx imagetools create \
            --tag ghcr.io/deliciousbuding/fund-dashboard:${{ github.sha }} \
            ghcr.io/deliciousbuding/fund-dashboard:${{ github.sha }}-amd64 \
            ghcr.io/deliciousbuding/fund-dashboard:${{ github.sha }}-arm64
