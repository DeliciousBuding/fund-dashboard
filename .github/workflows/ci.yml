name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund-dashboard-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for the following files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Run Go tests (with race detector)
        run: go test ./... -count=1 -race

  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
      - name: Build Go binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/fund-dashboard/

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (biome)
        run: pnpm exec biome check .
      - name: Unit tests (vitest)
        run: pnpm -C web test

      - name: Contracts tests (node:test)
        run: node --test "packages/contracts/**/*.test.ts"

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck + build (tsc + vite → internal/webui/dist)
        run: pnpm -C web build

  # -- P2 quick wins: Go static analysis, Go vuln scan, JS/TS advisory audit ----
  # Branch protection on main requires exactly five checks: test-go, build-go,
  # test-web, build-web, smoke-e2e. Those job ids and their reported behaviour
  # are untouched; the jobs below are added alongside them, so they surface as
  # extra (non-required) checks and cannot silently unsatisfy branch protection.
  # None of them is referenced from the `needs:` of the five gated jobs, and none
  # of the five gained continue-on-error.

  lint-go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Curated set = exactly the golangci-lint v1.64.8 linters that are green on
      # today's tree. Verified locally with go1.26.6 + golangci-lint v1.64.8:
      #   golangci-lint run ./... --disable-all --enable=<this list>
      #   -> exit 0, zero findings.
      # golangci-lint is pinned to v1.x on purpose: v2 merged staticcheck /
      # gosimple / stylecheck into one linter and changed the flag surface, so
      # this list is only valid for v1. Re-validate it before a major bump.
      #
      # Deliberately NOT enabled because they report pre-existing findings in
      # files outside this lane's write territory. They are neither fixed here
      # nor suppressed file-by-file; they are recorded as follow-up work:
      #   errcheck 6 | staticcheck 4 | gosimple 2 | ineffassign 2 | gosec 12 |
      #   revive 34 | predeclared 9 | unparam 9 | whitespace 6 | errorlint 3 |
      #   exhaustive 3 | copyloopvar 2 | sqlclosecheck 1 | noctx 1 | nilerr 1
      # NOT enabled because a required check already does the same work:
      #   govet -> test-go runs `go vet ./...`
      #   gofmt -> test-go runs `gofmt -l .`
      # NOT enabled because it would tighten the formatter policy beyond the
      # existing gofmt gate (a separate decision, not a CI quick win):
      #   gofumpt, goimports, gci.
      GCL_LINTERS: asasalint,bidichk,bodyclose,durationcheck,fatcontext,forbidigo,gocheckcompilerdirectives,makezero,mirror,misspell,nakedret,nilnesserr,nolintlint,nosprintfhostport,reassign,rowserrcheck,sloglint,stylecheck,unconvert,unused
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
      - name: Install golangci-lint (pinned)
        # Installed with `go install <module>@<version>` instead of a
        # third-party action: the module comes from the Go module proxy and its
        # checksum is verified against sum.golang.org, so this adds no new
        # unpinned supply-chain dependency. Confirmed to compile and run under
        # go1.26.6 (same toolchain the required Go jobs already use).
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: golangci-lint (curated green set)
        run: |
          echo "enabled linters: $GCL_LINTERS"
          golangci-lint run ./... --disable-all --enable="$GCL_LINTERS" --timeout=10m

  vuln-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.6'
      - name: Install govulncheck (pinned)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: govulncheck (source mode)
        # Gated, not advisory. Source-mode govulncheck reports only advisories
        # whose symbols this code actually calls, so a finding is actionable by
        # definition (bump the module) rather than a speculative "you depend on a
        # module that once had a CVE" list. No severity or package narrowing is
        # applied.
        # Verified locally on this exact tree: exit 0, "Your code is affected by
        # 0 vulnerabilities"; 3 further advisories in required modules are
        # reported as not called and do not fail the scan.
        # If this ever goes red, the fix is a go.mod/go.sum bump, which is
        # outside this lane's write territory: escalate to the owning lane rather
        # than silencing the check. It is not one of the five required checks, so
        # red here does not by itself block a merge.
        run: govulncheck ./...

  audit-web:
    # ADVISORY. This is the only continue-on-error in the workflow and it sits on
    # a new job, never on one of the five required checks.
    # Why advisory rather than gated:
    #   1. `pnpm audit` answers from a live third-party advisory DB, not from the
    #      commit, so its verdict is not reproducible from a given tree. Observed
    #      locally: two HTTP 503 responses from the audit endpoint (absorbed by
    #      pnpm's own retries) before a clean answer came back.
    #   2. Silencing an unfixable advisory needs `pnpm.auditConfig` in
    #      package.json, which is outside this lane's write territory, so a hard
    #      gate here could only ever be cleared by a different lane.
    # No severity narrowing was needed: today the full audit (prod + dev, every
    # severity) reports "No known vulnerabilities found", exit 0. The complete
    # report is printed so a real advisory stays visible on the PR.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: JS/TS dependency advisories (pnpm audit, lockfile-driven)
        # No `pnpm install` first: audit reads pnpm-lock.yaml directly (verified
        # locally with node_modules absent). Lint and typecheck are deliberately
        # NOT repeated here - test-web already runs `biome check .`, and
        # build-web already runs `tsc --noEmit` inside `pnpm -C web build`.
        run: pnpm audit

  # ── Container + API smoke (seeded DB) ──────────────────────────
  # The SPA is embedded in the image (go:embed); smoke covers the Go API,
  # the auth gate, and the embedded SPA shell.

  smoke-e2e:
    needs: [test-go, build-go, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm

      - name: Install browser test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Seed CI database
        run: |
          chmod +x scripts/seed-ci-db.sh
          ./scripts/seed-ci-db.sh deploy/ci-data
          # container runs as unprivileged 'fund' user; make ci-data writable
          chmod -R 777 deploy/ci-data

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: fund-dashboard:ci
          load: true

      - name: Start services
        run: |
          docker compose -f deploy/docker-compose.ci.yml up -d
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/health 2>/dev/null | grep -q '"ok"' && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"ok"'

      - name: API auth smoke
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/status)
          test "$code" = "401"
          curl -fsS -H 'Authorization: Bearer ci-test-key' http://localhost:8080/api/admin/status | grep -q '"ok":true'
          curl -fsS -H 'Authorization: Bearer ci-test-key' http://localhost:8080/api/admin/dashboard | grep -q '"go_version"'

          # Session gate: reads are closed without a cookie.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/portfolio)
          test "$code" = "401"

          # First-run setup → session cookie → reads open.
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/fund-cookies -X POST http://localhost:8080/api/auth/setup \
            -H 'Content-Type: application/json' -H 'X-Fund-Request: fetch' \
            -d '{"password":"ci-smoke-password-1"}')
          test "$code" = "201"
          curl -fsS -b /tmp/fund-cookies http://localhost:8080/api/portfolio | grep -q 'total_tx'
          curl -fsS -b /tmp/fund-cookies http://localhost:8080/api/funds | grep -q '019173'

          # Embedded SPA shell is served at /.
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'

          # MCP bearer auth is unchanged.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$code" = "401"
          curl -fsS -X POST http://localhost:8080/mcp \
            -H 'Authorization: Bearer ci-test-key' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'get_portfolio_summary'

      # Full remote-connector path: discovery -> DCR -> authorize with the
      # session from the step above -> PKCE token exchange -> authenticated MCP
      # call -> refresh rotation, plus the negative cases (unregistered
      # redirect_uri must not redirect, code single-use, read scope hides write
      # tools, legacy static keys unchanged).
      - name: OAuth MCP connector smoke
        run: |
          chmod +x scripts/smoke-oauth.sh
          MCP_API_KEY=ci-test-key PUBLIC_MCP_KEY=ci-public-key \
            ./scripts/smoke-oauth.sh http://localhost:8080 ci-smoke-password-1

      - name: Browser E2E (Chromium)
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_PASSWORD: ci-smoke-password-1

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show docker logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.ci.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.ci.yml down -v || true

  # ── Docker build & push to GHCR (parallel native runners) ──────

  build-and-push:
    needs: [test-go, build-go, smoke-e2e]
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.arch }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: |
            ghcr.io/deliciousbuding/fund-dashboard:${{ matrix.arch }}-latest
            ghcr.io/deliciousbuding/fund-dashboard:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max

  # Merge per-arch images into multi-arch manifest lists for `latest` and `<sha>`.
  merge-manifest:
    needs: build-and-push
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge architecture manifests
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/deliciousbuding/fund-dashboard:latest \
            ghcr.io/deliciousbuding/fund-dashboard:amd64-latest \
            ghcr.io/deliciousbuding/fund-dashboard:arm64-latest
          docker buildx imagetools create \
            --tag ghcr.io/deliciousbuding/fund-dashboard:${{ github.sha }} \
            ghcr.io/deliciousbuding/fund-dashboard:${{ github.sha }}-amd64 \
            ghcr.io/deliciousbuding/fund-dashboard:${{ github.sha }}-arm64
