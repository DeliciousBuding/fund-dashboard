# CI E2E docker-compose — one Go image serves API/MCP and SPA.
# Seed DB first: ./scripts/seed-ci-db.sh

services:
  fund-dashboard:
    image: fund-dashboard:ci
    container_name: fund-ci-dashboard
    ports:
      - "${WEB_PORT:-8080}:8765"
    volumes:
      - ./ci-data:/app/data
    environment:
      - FUND_DB_PATH=/app/data/fund.db
      - FUND_STATIC_DIR=/app/web
      - FUND_HTTP_ADDR=0.0.0.0:8765
      - FUND_ENV=ci
      - MCP_API_KEY=ci-test-key
      - PUBLIC_MCP_KEY=ci-public-key
      - FUND_EDGE_KEY=ci-edge-key
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/api/health || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
