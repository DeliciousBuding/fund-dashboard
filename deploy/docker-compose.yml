# Production compose — single container, SQLite persistence, unprivileged user.
#
# Setup:
#   cp .env.example .env
#   # fill MCP_API_KEY (openssl rand -hex 32); web 登录密码首次访问 /setup 设置
#   docker compose up -d
#
# Secrets are read from .env, never committed. The image runs as the
# unprivileged 'fund' user; ./data is volume-mounted and must be writable.
# The web UI ships embedded via go:embed (no static dir to mount).

services:
  fund-dashboard:
    image: ghcr.io/deliciousbuding/fund-dashboard:latest
    container_name: fund-dashboard
    restart: unless-stopped
    ports:
      - "${FUND_PORT:-8765}:8765"
    volumes:
      - ./data:/app/data
      # Backup directory surfaced by /api/admin/backup-status; the in-container
      # backup producer is disabled, so this is a mount point for external jobs.
      - ./backups:/app/backups
    environment:
      - FUND_HTTP_ADDR=0.0.0.0:8765
      - FUND_DB_PATH=/app/data/fund.db
      - FUND_ENV=${FUND_ENV:-production}
      # Fail fast if the operator key is missing (production requires >=16 chars).
      - MCP_API_KEY=${MCP_API_KEY:?set MCP_API_KEY in .env, e.g. openssl rand -hex 32}
      - PUBLIC_MCP_KEY=${PUBLIC_MCP_KEY:-}
      - FUND_EDGE_KEY=${FUND_EDGE_KEY:-}
      - FUND_EDGE_AUTH_ENABLED=${FUND_EDGE_AUTH_ENABLED:-true}
      - FUND_AUTH_PASSWORD_HASH=${FUND_AUTH_PASSWORD_HASH:-}
      - FUND_AUTH_SESSION_TTL=${FUND_AUTH_SESSION_TTL:-}
      - FUND_AUTH_SESSION_MAX_AGE=${FUND_AUTH_SESSION_MAX_AGE:-}
      - FUND_AUTH_SECURE_COOKIE=${FUND_AUTH_SECURE_COOKIE:-}
      - FUND_ALLOWED_ORIGINS=${FUND_ALLOWED_ORIGINS:-}
      - FUND_AGENT_OPS_ENABLED=${FUND_AGENT_OPS_ENABLED:-}
      - FUND_AGENT_CONFIRMATION_SECRET=${FUND_AGENT_CONFIRMATION_SECRET:-}
      - FUND_API_RPM=${FUND_API_RPM:-}
      - FUND_MCP_RPM=${FUND_MCP_RPM:-}
      - FUND_TRUSTED_PROXIES=${FUND_TRUSTED_PROXIES:-}
      - FUND_OAUTH_ENABLED=${FUND_OAUTH_ENABLED:-}
      - FUND_PUBLIC_BASE_URL=${FUND_PUBLIC_BASE_URL:-}
      - FUND_OAUTH_SIGNING_KEY=${FUND_OAUTH_SIGNING_KEY:-}
      - FUND_OAUTH_ACCESS_TTL=${FUND_OAUTH_ACCESS_TTL:-}
      - FUND_OAUTH_REFRESH_TTL=${FUND_OAUTH_REFRESH_TTL:-}
      - FUND_OAUTH_CODE_TTL=${FUND_OAUTH_CODE_TTL:-}
      - FUND_OAUTH_AUTO_APPROVE=${FUND_OAUTH_AUTO_APPROVE:-}
      - FUND_OAUTH_ALLOW_WRITE_SCOPE=${FUND_OAUTH_ALLOW_WRITE_SCOPE:-}
      - FUND_OAUTH_CIMD_HOSTS=${FUND_OAUTH_CIMD_HOSTS:-}
      - FUND_OAUTH_RPM=${FUND_OAUTH_RPM:-}
      - FUND_DB_DRIVER=${FUND_DB_DRIVER:-}
      - FUND_PG_DSN=${FUND_PG_DSN:-}
      - FUND_SERVICE_NAME=${FUND_SERVICE_NAME:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - FUND_BACKUP_DIR=/app/backups
      - TZ=${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
